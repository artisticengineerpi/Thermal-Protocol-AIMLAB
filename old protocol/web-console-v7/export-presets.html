<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export AIMLAB presets</title><style>body{font:16px system-ui;color:#203047;background:#f4f7fa;max-width:900px;margin:40px auto;padding:20px}button{font:inherit;padding:12px 20px;border:1px solid #9aafc5;border-radius:8px;background:white;cursor:pointer}pre{padding:20px;background:white;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Export saved presets</h1><p>Open this page in the same browser/profile and address (127.0.0.1:8770) used for your experiment. This page only reads presets; it does not connect to the Uno or change settings.</p><p id="status"></p><button id="download" disabled>Download presets JSON</button><pre id="data"></pre><script>
let raw;
try{raw=localStorage.getItem('aimlab-presets-v1');const data=raw?JSON.parse(raw):[];if(!Array.isArray(data))throw Error('Unexpected preset format');document.getElementById('status').textContent=data.length?`${data.length} saved presets found.`:'No saved presets found here. Use the same browser/profile as the experiment.';document.getElementById('data').textContent=JSON.stringify(data,null,2);document.getElementById('download').disabled=!data.length;}catch(e){document.getElementById('status').textContent='Could not read presets: '+e.message;}
document.getElementById('download').onclick=()=>{const u=URL.createObjectURL(new Blob([raw],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='AIMLAB-participant-presets.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
